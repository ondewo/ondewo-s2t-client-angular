# Auto-fix the mechanical rules (blank-line spacing, list indentation, emphasis
# style, ...) the same way ruff-format does for Python.
fix: true
config:
  # MD013 line-length: docs contain long lines / tables.
  MD013: false
  # MD033 no-inline-html: docs embed <p>/<code> HTML tags.
  MD033: false
  MD053: false
  # MD024 duplicate-heading: changelogs repeat "### Improvements" / "### Breaking
  # Changes" under each release section; allow when not direct siblings.
  MD024:
    siblings_only: true
  # MD040 fenced-code-language: README embeds plain directory-tree / output blocks.
  MD040: false
  # MD041 first-line-heading: README opens with the HTML branding/logo header.
  MD041: false
  # MD045 image-alt-text: the branding header uses <img> logos / social icons.
  MD045: false
# NO `globs:` HERE ON PURPOSE. The pre-commit hook always passes the changed files as
# CLI arguments, and markdownlint-cli2 ADDS the config globs on top of them. pre-commit
# chunks a large file list into several invocations, so a `*.md` glob made every batch
# re-lint (and re-write) the same root markdown: two batches read the pre-fix buffer and
# the second one wrote its stale copy back, silently DELETING changelog bullets and
# `### Improvements` headings from RELEASE.md. Without globs each file is fixed exactly once.
ignores:
  - 'node_modules/**'
  - 'api/**'
  - 'fesm2022/**'
  - 'ondewo-proto-compiler/**'
  - 'src/ondewo-s2t-api/**'
  - '.venv/**'
